    // ===== Helpers =====
    const fmtPreco = (n) =>
      "R$ " + n.toFixed(2).replace(".", ",");

    const normalizar = (s) =>
      s.toLowerCase()
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "");

    function getSec(secId) {
      return SECOES.find((s) => s.id === secId);
    }

    function getSubgrupo(secKey, slug) {
      const lista = SUBGRUPOS_ORDEM[secKey];
      if (!lista) return null;
      return lista.find((g) => g.slug === slug);
    }

    function contagem(secKey, grupoLabel) {
      return PRODUTOS.filter((p) =>
        p.sub === secKey && (grupoLabel ? p.grupo === grupoLabel : true)
      ).length;
    }

    function plural(n) {
      return n + " " + (n === 1 ? "item" : "itens");
    }

    // ===== Construção de elementos =====
    function criarLista(itens) {
      const ul = document.createElement("ul");
      ul.className = "lista";
      for (const p of itens) {
        const li = document.createElement("li");
        li.className = "item";
        const nome = document.createElement("span");
        nome.className = "nome";
        nome.textContent = p.nome;
        const preco = document.createElement("span");
        preco.className = "preco";
        preco.textContent = fmtPreco(p.preco) + "/" + p.un;
        li.append(nome, preco);
        ul.appendChild(li);
      }
      return ul;
    }

    function criarBreadcrumb(trilha) {
      // trilha: array de { label, href? }
      const nav = document.createElement("nav");
      nav.className = "breadcrumb";
      trilha.forEach((item, i) => {
        if (i > 0) {
          const sep = document.createElement("span");
          sep.className = "breadcrumb-sep";
          sep.textContent = "›";
          nav.appendChild(sep);
        }
        if (item.href) {
          const a = document.createElement("a");
          a.href = item.href;
          a.textContent = item.label;
          nav.appendChild(a);
        } else {
          const span = document.createElement("span");
          span.className = "breadcrumb-atual";
          span.textContent = item.label;
          nav.appendChild(span);
        }
      });
      return nav;
    }

    function criarCard(href, titulo, contagemTxt, fotoId) {
      const a = document.createElement("a");
      a.className = "card";
      a.href = href;

      if (fotoId) {
        const img = document.createElement("img");
        img.className = "card-img";
        img.src = "https://images.unsplash.com/photo-" + fotoId + "?w=400&h=300&fit=crop&auto=format&q=75";
        img.loading = "lazy";
        img.alt = "";
        a.appendChild(img);
      }

      const corpo = document.createElement("div");
      corpo.className = "card-corpo";
      const t = document.createElement("div");
      t.className = "card-titulo";
      t.textContent = titulo;
      const c = document.createElement("div");
      c.className = "card-contagem";
      c.textContent = contagemTxt;
      corpo.append(t, c);
      a.appendChild(corpo);
      return a;
    }

    // ===== Renders =====
    function renderHome() {
      const root = document.getElementById("conteudo");
      root.innerHTML = "";

      const h2 = document.createElement("h2");
      h2.className = "pagina-titulo";
      h2.textContent = "Categorias";
      root.appendChild(h2);

      const grid = document.createElement("div");
      grid.className = "grid-cards";

      for (const sec of SECOES) {
        const n = contagem(sec.key);
        if (n === 0) continue;
        grid.appendChild(criarCard("#/" + sec.id, sec.label, plural(n), sec.foto));
      }

      root.appendChild(grid);
    }

    function renderCategoria(secId) {
      const root = document.getElementById("conteudo");
      root.innerHTML = "";

      const sec = getSec(secId);
      if (!sec) return renderHome();

      root.appendChild(criarBreadcrumb([
        { label: "Início", href: "#/" },
        { label: sec.label }
      ]));

      const h2 = document.createElement("h2");
      h2.className = "pagina-titulo";
      h2.textContent = sec.label;
      root.appendChild(h2);

      const subgrupos = SUBGRUPOS_ORDEM[sec.key];

      if (subgrupos) {
        const grid = document.createElement("div");
        grid.className = "grid-cards";
        for (const gr of subgrupos) {
          const n = contagem(sec.key, gr.label);
          if (n === 0) continue;
          grid.appendChild(criarCard("#/" + sec.id + "/" + gr.slug, gr.label, plural(n), gr.foto));
        }
        root.appendChild(grid);
      } else {
        const itens = PRODUTOS
          .filter((p) => p.sub === sec.key)
          .sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
        root.appendChild(criarLista(itens));
      }
    }

    function renderSubgrupo(secId, grupoSlug) {
      const root = document.getElementById("conteudo");
      root.innerHTML = "";

      const sec = getSec(secId);
      if (!sec) return renderHome();
      const grupo = getSubgrupo(sec.key, grupoSlug);
      if (!grupo) return renderCategoria(secId);

      root.appendChild(criarBreadcrumb([
        { label: "Início", href: "#/" },
        { label: sec.label, href: "#/" + sec.id },
        { label: grupo.label }
      ]));

      const h2 = document.createElement("h2");
      h2.className = "pagina-titulo";
      h2.textContent = grupo.label;
      root.appendChild(h2);

      const itens = PRODUTOS
        .filter((p) => p.sub === sec.key && p.grupo === grupo.label)
        .sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
      root.appendChild(criarLista(itens));
    }

    function renderBusca(termo) {
      const t = normalizar(termo.trim());
      const root = document.getElementById("conteudo");
      root.innerHTML = "";

      const h2 = document.createElement("h2");
      h2.className = "pagina-titulo";
      h2.textContent = "Resultados para “" + termo + "”";
      root.appendChild(h2);

      let total = 0;

      for (const sec of SECOES) {
        const itensSec = PRODUTOS.filter(
          (p) => p.sub === sec.key && normalizar(p.nome).includes(t)
        );
        if (itensSec.length === 0) continue;
        total += itensSec.length;

        const subgrupos = SUBGRUPOS_ORDEM[sec.key];

        const secBox = document.createElement("section");
        secBox.className = "resultado-secao";

        const linkSec = document.createElement("a");
        linkSec.href = "#/" + sec.id;
        linkSec.className = "resultado-secao-titulo";
        linkSec.textContent = sec.label;
        secBox.appendChild(linkSec);

        if (subgrupos) {
          for (const gr of subgrupos) {
            const itensGr = itensSec.filter((p) => p.grupo === gr.label);
            if (itensGr.length === 0) continue;
            const h3 = document.createElement("h3");
            h3.className = "subgrupo";
            const linkSub = document.createElement("a");
            linkSub.href = "#/" + sec.id + "/" + gr.slug;
            linkSub.textContent = gr.label;
            h3.appendChild(linkSub);
            secBox.appendChild(h3);
            secBox.appendChild(criarLista(
              itensGr.sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"))
            ));
          }
        } else {
          secBox.appendChild(criarLista(
            itensSec.sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"))
          ));
        }

        root.appendChild(secBox);
      }

      if (total === 0) {
        const msg = document.createElement("p");
        msg.className = "vazio";
        msg.textContent = "Nenhum produto encontrado.";
        root.appendChild(msg);
      }
    }

    // ===== Roteamento =====
    function partesDoHash() {
      const h = location.hash.replace(/^#\/?/, "");
      return h.split("/").filter(Boolean);
    }

    function rotear() {
      const termo = document.getElementById("busca").value.trim();
      if (termo) {
        renderBusca(termo);
        return;
      }
      const partes = partesDoHash();
      if (partes.length === 0) renderHome();
      else if (partes.length === 1) renderCategoria(partes[0]);
      else renderSubgrupo(partes[0], partes[1]);
      window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
    }

    const inputBusca = document.getElementById("busca");
    const btnLimpar = document.getElementById("limpar");

    inputBusca.addEventListener("input", rotear);
    btnLimpar.addEventListener("click", () => {
      inputBusca.value = "";
      rotear();
      inputBusca.focus();
    });
    window.addEventListener("hashchange", () => {
      inputBusca.value = "";
      rotear();
    });

    rotear();
  </script>

</body>
</html>
